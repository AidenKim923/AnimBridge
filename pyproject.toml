[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unityanimbridge"
dynamic = ["version"]
description = "Convert Unity .anim / .fbx animations to FBX files Unreal Engine can import"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6", "numpy>=1.24"]

[project.urls]
Repository = "https://github.com/AidenKim923/AnimBridge"
Issues = "https://github.com/AidenKim923/AnimBridge/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
uab = "unityanimbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "blender: needs Blender (slow)",
  "unity: needs Unity editor (very slow)",
  "unreal: needs Unreal editor (very slow)",
]
addopts = "-m 'not unity and not unreal'"
