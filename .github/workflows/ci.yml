name: ci

# Runs on every push to main and every pull request (forks included). It needs no
# secrets and only a read-only token. The heavier distribution matrix lives in
# cross-platform.yml and stays paused. macOS is left out on purpose for now.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev zstd
      - name: Install build and test tools
        # The editable install puts src/ on the import path, so pytest finds `unityanimbridge`.
        run: |
          python -m pip install --constraint packaging/ci-constraints.txt pip setuptools wheel cmake ninja
          python -m pip install --constraint packaging/ci-constraints.txt --no-build-isolation -e ".[test]"
      - name: Python tests
        run: python -m pytest tests -q -m "not blender and not unity and not unreal" -p no:cacheprovider
      - name: Build native code with tests
        shell: bash
        run: |
          cmake -S . -B _verify/ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DANIMBRIDGE_BUILD_DESKTOP=ON -DANIMBRIDGE_ENABLE_SOURCE_FALLBACK=ON -DANIMBRIDGE_ENABLE_UI_TEST_HOOKS=OFF
          cmake --build _verify/ci --config Release --parallel
      - name: Native tests
        shell: bash
        run: ctest --test-dir _verify/ci -C Release --output-on-failure
